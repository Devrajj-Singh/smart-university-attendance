services:
  db:
    image: postgres:16-alpine
    container_name: smart-attendance-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smart_attendance}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_attendance"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-attendance-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smart_attendance
      - JWT_SECRET=smart_attendance_jwt_secure_key_2026
      - SERVER_LAN_IP=${SERVER_LAN_IP:-192.168.1.6}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
